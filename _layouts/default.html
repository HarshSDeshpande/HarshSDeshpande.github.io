<!DOCTYPE html>
<html lang="en-us">

  {% include head.html %}

  <body>

    {% include sidebar.html %}

    <!-- Wrap is the content to shift when toggling the sidebar. We wrap the
         content to avoid any CSS collisions with our real content. -->
    <div class="wrap">
      <div class="masthead">
        <div class="container">
          <div class="masthead-wrapper">
            <h3 class="masthead-title">
              <a href="{{ site.baseurl }}/" title="Home">{{ site.title }}</a>
              <small>{{ site.tagline }}</small>
            </h3>
            <div class="theme-switch-wrapper">
              <button class="theme-switch" id="theme-toggle" aria-label="Toggle dark mode">
                <div class="theme-switch-track">
                  <div class="theme-switch-thumb">
                    <svg class="light-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                      <path d="M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2a7 7 0 1 1 0-14 7 7 0 0 1 0 14zM11 3V1h2v2h-2zm0 20v-2h2v2h-2zM3.515 5.636L2.1 4.222l1.414-1.414 1.414 1.414-1.414 1.414zm16.97 12.728l1.414 1.414-1.414 1.414-1.414-1.414 1.414-1.414zM3.515 18.364l1.414-1.414 1.414 1.414-1.414 1.414-1.414-1.414zM20.485 5.636l-1.414-1.414 1.414-1.414 1.414 1.414-1.414 1.414zM23 13h-2v-2h2v2zM3 13H1v-2h2v2z" />
                    </svg>
                    <svg class="dark-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                      <path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z" />
                    </svg>
                  </div>
                </div>
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="container content">
        {{ content }}
      </div>
    </div>

    <label for="sidebar-checkbox" class="sidebar-toggle"></label>

    <script src='{{ site.baseurl }}/public/js/script.js'></script>
  </body>
</html>
